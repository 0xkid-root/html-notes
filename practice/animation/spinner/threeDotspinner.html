<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three Dots</title>

    <style>
        .loader {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 15px;
            height: 15px;

            background: black;

            border-radius: 50%;

            animation: bounce 0.8s infinite alternate;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }
    </style>
</head>

<body>

    <div class="loader">

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

    </div>

</body>

</html>
