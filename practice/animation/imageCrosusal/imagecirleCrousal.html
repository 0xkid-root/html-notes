<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Image Carousel</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Main carousel */

        .carousel {
            width: 100%;
            height: 400px;

            display: flex;
            justify-content: center;
            align-items: center;

            perspective: 1200px;
        }

        /* 3D rotating container */

        .carousel-track {
            width: 220px;
            height: 300px;

            position: relative;

            transform-style: preserve-3d;

            animation: rotateCarousel 15s linear infinite;
        }

        /* Images */

        .image {
            width: 220px;
            height: 300px;

            object-fit: cover;

            position: absolute;

            top: 0;
            left: 0;

            border: 2px solid #222;

            backface-visibility: visible;
        }

        /* Position five images in a circle */

        .image1 {
            transform: rotateY(0deg) translateZ(350px);
        }

        .image2 {
            transform: rotateY(72deg) translateZ(350px);
        }

        .image3 {
            transform: rotateY(144deg) translateZ(350px);
        }

        .image4 {
            transform: rotateY(216deg) translateZ(350px);
        }

        .image5 {
            transform: rotateY(288deg) translateZ(350px);
        }

        /* Continuous 360-degree rotation */

        @keyframes rotateCarousel {

            from {
                transform: rotateY(0deg);
            }

            to {
                transform: rotateY(360deg);
            }

        }

    </style>

</head>

<body>

    <div class="carousel">

        <div class="carousel-track">

            <img
                class="image image1"
                src="https://picsum.photos/id/1015/400/500"
                alt="Image 1"
            >

            <img
                class="image image2"
                src="https://picsum.photos/id/1016/400/500"
                alt="Image 2"
            >

            <img
                class="image image3"
                src="https://picsum.photos/id/1018/400/500"
                alt="Image 3"
            >

            <img
                class="image image4"
                src="https://picsum.photos/id/1020/400/500"
                alt="Image 4"
            >

            <img
                class="image image5"
                src="https://picsum.photos/id/1024/400/500"
                alt="Image 5"
            >

        </div>

    </div>

</body>

</html>
