<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>5 Image Carousel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111827;

            font-family: Arial, sans-serif;
        }


        /* Carousel container */

        .carousel {
            width: 900px;
            height: 220px;

            overflow: hidden;

            border: 2px solid white;

            position: relative;

            display: flex;
            align-items: center;
        }


        /* Moving area */

        .track {
            display: flex;

            gap: 30px;

            width: max-content;

            animation: moveImages 10s ease-in-out infinite;
        }


        /* Images */

        .image {
            width: 150px;
            height: 150px;

            object-fit: cover;

            border-radius: 20px;

            border: 4px solid white;

            flex-shrink: 0;

            transition: transform 0.3s;
        }


        /* Image hover */

        .image:hover {
            transform: scale(1.1);
        }


        /* Move left and right */

        @keyframes moveImages {

            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(-350px);
            }

            100% {
                transform: translateX(0);
            }

        }
    </style>

</head>


<body>


    <div class="carousel">

        <div class="track">

            <img class="image image1" src="https://picsum.photos/id/1015/300/300" alt="Image 1">

            <img class="image image2" src="https://picsum.photos/id/1016/300/300" alt="Image 2">

            <img class="image image3" src="https://picsum.photos/id/1018/300/300" alt="Image 3">

            <img class="image image4" src="https://picsum.photos/id/1020/300/300" alt="Image 4">

            <img class="image image5" src="https://picsum.photos/id/1024/300/300" alt="Image 5">

        </div>

    </div>


</body>

</html>
