<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: skyblue;
            overflow: hidden;
        }

        .road {
            position: absolute;
            bottom: 0;

            width: 100%;
            height: 150px;

            background: #333;
        }

        .car {
            position: absolute;
            bottom: 150px;
            left: -200px;

            font-size: 100px;

            animation: drive 5s linear infinite;
        }

        @keyframes drive {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(120vw);
            }

        }
    </style>

</head>

<body>

    <div class="car">
        🚗
    </div>

    <div class="road"></div>

</body>

</html>
