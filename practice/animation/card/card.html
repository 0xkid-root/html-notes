<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three Animated Cards</title>

    <style>
        body {
            margin: 0;
            padding: 50px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .card {
            width: 300px;
            background: white;
            border-radius: 20px;
            overflow: hidden;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);

            transition: transform 0.4s, box-shadow 0.4s;

            animation: cardEntry 1s ease;
        }

        /* Card hover */
        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        /* Image */
        .image-box {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: transform 0.5s;
        }

        /* Image zoom */
        .card:hover .image-box img {
            transform: scale(1.1);
        }

        /* Content */
        .content {
            padding: 20px;
        }

        .content h2 {
            margin-top: 0;
        }

        .content p {
            color: gray;
            line-height: 1.5;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: black;
            color: white;

            font-size: 16px;
            cursor: pointer;

            transition: transform 0.3s, background 0.3s;
        }

        .btn:hover {
            background: red;
            transform: scale(1.05);
        }

        /* Card entry animation */
        @keyframes cardEntry {

            from {
                opacity: 0;
                transform: translateY(80px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }
    </style>

</head>

<body>

    <div class="cards">

        <!-- Card 1 -->
        <div class="card">

            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Shoes">
            </div>

            <div class="content">

                <h2>Running Shoes</h2>

                <p>
                    Comfortable and stylish running shoes
                    for everyday use.
                </p>

                <button class="btn">Buy Now</button>

            </div>

        </div>


        <!-- Card 2 -->
        <div class="card">

            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="Watch">
            </div>

            <div class="content">

                <h2>Smart Watch</h2>

                <p>
                    Modern smartwatch with a clean
                    and stylish design.
                </p>

                <button class="btn">Buy Now</button>

            </div>

        </div>


        <!-- Card 3 -->
        <div class="card">

            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" alt="Headphones">
            </div>

            <div class="content">

                <h2>Headphones</h2>

                <p>
                    Enjoy high-quality sound with
                    comfortable headphones.
                </p>

                <button class="btn">Buy Now</button>

            </div>

        </div>

    </div>

</body>

</html>
