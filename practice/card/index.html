<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Cards</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="title">Our Products</h1>

    <div class="cards">

        <!-- Card 1 -->
        <div class="card">

            <span class="sale">SALE</span>

            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Shoes">
            </div>

            <h2>Running Shoes</h2>

            <p>
                Comfortable and stylish running shoes
                for your daily workout.
            </p>

            <h3>₹1,999</h3>

            <button>Buy Now</button>

        </div>


        <!-- Card 2 -->
        <div class="card">

            <span class="sale">SALE</span>

            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="Watch">
            </div>

            <h2>Smart Watch</h2>

            <p>
                Smart and stylish watch for your
                everyday activities.
            </p>

            <h3>₹2,499</h3>

            <button>Buy Now</button>

        </div>


        <!-- Card 3 -->
        <div class="card">

            <span class="sale">SALE</span>

            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62" alt="Backpack">
            </div>

            <h2>Travel Backpack</h2>

            <p>
                Strong and comfortable backpack
                for travel and college.
            </p>

            <h3>₹999</h3>

            <button>Buy Now</button>

        </div>

    </div>

</body>

</html>
