<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup pages </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>

        <div class="signup-card">

            <div class="left-section">
                <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=800&q=80"
                    alt="signup">
            </div>

            <div class="right-section">

                <h1>Create Your Account </h1>
                <p>Join us and start your journey</p>

                <form action="#">
                    <label for="fullName">FUll Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter Your Name">
                    <label for="email">Email</label>
                    <input type="email" placeholder="Enter Your Email" name="email">
                    <label for="password">Password</label>
                    <input type="password" placeholder="Enter Your Passowrd" name="password">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" placeholder="Enter Your Passowrd" name="confirmPassword">
                    <button type="submit">Create Account</button>



                </form>

                <p class="login-txt">
                    Already have an account? <a href="#">Login</a>
                </p>
            </div>
        </div>

    </section>
</body>

</html>
