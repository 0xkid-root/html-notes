<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StremFlix - Watch Movies & stream </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- navbar  -->

    <header class="navbar">

        <div class="logo">
            STREAM <span>fLIX</span>
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Tv SHows</a>
            <a href="#">Movies</a>
            <a href="#">My List</a>
            <a href="#">New & Popular</a>
        </nav>

        <div class="nav-right">

            <div class="search">
                🔍︎
                <input type="text" placeholder="search...">
            </div>

            <span class="notification">🔔</span>
            <div class="profile">
                G
            </div>


        </div>


    </header>

    <!-- heroo sectiion  -->
    <section class="hero">

        <div class="hero-content">

            <p class="small-text">STREAMFLIX ORIGINAL</p>

            <h1>THE LAST <br>HORIZON
            </h1>

            <div class="hero-info">
                <span>2026</span>
                <span>16+</span>
                <span>2h 18m </span>
                <span>Action</span>
                <span>Adventure</span>
            </div>

            <p class="description">After humanity loses contact with the outer colonies, a former space commander begins
                a dangerous journey
                beyond the last known horizon to discover what happened.

            </p>

            <div class="hero-buttons">
                <button class="play-btn">▶︎Action</button>
                <button class="sign-btn">ⓘ signin</button>
            </div>

        </div>
    </section>
</body>

</html>
