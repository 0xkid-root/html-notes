<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Alignment</title>

    <style>
        .container {
            width: 600px;
            height: 400px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);

            gap: 10px;


            border: 3px solid black;
            justify-items: center;

        }

        .box {
            background-color: steelblue;
            border: 2px solid black;
        }

        /* .box:nth-child(1) {
            justify-self: end;
        } */
        /* .box:nth-child(1) {
            align-self: end;
        } */
        /* .box:nth-child(1) {
            place-self: center;
        } */
    </style>
</head>

<body>

    <div class="container">

        <div class="box">box 1</div>
        <div class="box">2</div>
        <div class="box">3</div>

        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>

    </div>

</body>

</html>
