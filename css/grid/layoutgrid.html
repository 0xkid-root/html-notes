<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout grid claSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
        }

        .container {
            width: 100%;
            height: 100%;
            background-color: beige;
            display: grid;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;

        }

        .item {
            border: 2px solid black;
            color: white;
            background-color: rgb(102, 239, 102);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-family: bold;
        }

        .header {
            /* grid-column-start: 1;
            grid-column-end: 4; */
            grid-column: 1/4;
        }

        .footer {
            grid-column-start: 1;
            grid-column-end: 4;

        }

        .sidebar {
            grid-row-start: 2;
            grid-row-end: 4;
        }

        .content1 {
            grid-column-start: 2;
            grid-column-end: 4;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="item header">item1 header</div>
        <div class="item sidebar">item2 sidebar </div>
        <div class="item content1">item3 content 1</div>
        <div class="item">item4</div>
        <div class="item">item5</div>
        <div class="item footer">item6 footer</div>
    </div>

</body>

</html>
