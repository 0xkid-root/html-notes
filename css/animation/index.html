        .box2 {
            height: 200px;

            background-color: red;
            border-radius: 50%;
            position: relative;
            left: 0px;
            animation-name: moveAnimation;
            animation-duration: 3s;
            animation-timing-function: ease-out;
            animation-direction: alternate;
            animation-iteration-count: infinite;

        }

        @keyframes moveAnimation {
            from {

            }

            to {
                left: 1000px;
            }
        }
