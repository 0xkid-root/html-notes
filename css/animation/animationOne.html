<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation playground </title>
    <style>
        .box {
            width: 300px;
            height: 80px;
            border: 2px solid brown;
            background-color: black;
            border-radius: 10px;
            position: relative;
            left: 0;
            top: 30px;
            animation-name: alokkumar;
            animation-duration: 4s;
            animation-delay: 2s;
            animation-timing-function: ease-in;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            /* animation: alokkumar 3s ease-out 1s infinite alternate; */

        }

        @keyframes alokkumar {
            from {
                left: 0;
                /* transform: scale(1); */
                /* transform: translate(0); */

            }

            to {
                left: 1380px;
                /* transform: scale(1.5); */
                /* transform: skew(45deg); */
                /* transform: translate(200px, 200px); */

            }
        }

        .box2 {
            width: 300px;
            height: 80px;
            border-radius: 10px;
            border: 2px solid brown;
            background-color: black;
            position: relative;
            animation-name: leftMovement;
            animation-duration: 4s;
            animation-delay: 2s;
            animation-timing-function: ease-in;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes leftMovement {
            from {
                top: 700px;
                left: 1350px;

            }

            to {
                left: 0;
                top: 700px;

            }
        }

        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: black;
            position: relative;
            top: 450px;
            left: 800px;
            animation-name: circleMovement;
            animation-duration: 4s;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-timing-function: normal;
            animation-direction: none;

        }

        @keyframes circleMovement {
            0% {
                top: 100px;
                left: 50px;

            }

            30% {
                top: 50px;
                left: 1280px;

            }

            60% {
                top: 550px;
                left: 800px;

            }

            100% {
                top: 600px;
                left: 1100x;

            }
        }
    </style>
</head>

<body>

    <div class="box">

    </div>

    <div class="circle"></div>
    <div class="box2"></div>

</body>

</html>
