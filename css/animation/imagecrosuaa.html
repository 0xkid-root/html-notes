<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;

        }

        .carousel-track {
            width: 900px;
            height: 230px;
            border: 2px solid white;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;


        }

        .carousel {
            display: flex;
            gap: 30px;
            animation: imagesMoves 8s ease-in-out infinite;
            animation-direction: alternate;
        }

        .image {
            width: 150px;
            height: 150px;
            border: 3px solid white;
            border-radius: 15px;
            object-fit: cover;
            transition: transform 1s;
        }

        .image:hover {
            transform: scale(1.3);
            transform: skew(20deg);
        }

        @keyframes imagesMoves {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(-250px);
            }

            100% {
                transform: translate(0);
            }
        }
    </style>
</head>

<body>
    <div class="carousel-track">

        <div class="carousel">
            <img src="https://picsum.photos/id/1015/300/300" class="image" alt="Imag1">
            <img src="https://picsum.photos/id/1016/300/300" class="image" alt="image2">
            <img src="https://picsum.photos/id/1018/300/300" class="image" alt="image3">
            <img src="https://picsum.photos/id/1020/300/300" class="image" alt="image4">
            <img src="https://picsum.photos/id/1024/300/300 " class="image" alt="image5">
        </div>

    </div>



</body>

</html>
