<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>

        <label for="name">Name*</label>

        <input type="text" placeholder="Enter Your name" id="name" name="userName" required maxlength="10"> <br><br>

        <label for="passowrd">Password*</label>

        <input type="password" placeholder="Enter Your Pasword" id="passowrd" name="userPassword" required
            maxlength="12"> <br><br>

        <label for="mobileNumber">Mobile Number* </label>

        <input type="number" placeholder="Enter Your Mobile Number" id="mobileNumber" name="mobileNumber" maxlength="10"
            required>
        <br><br>
        <label for="email">Email</label>
        <input type="email" placeholder="Enter your email" id="email" required><br><br>

        <label for="country">Country</label>

        <input type="text" value="India" id="country" readonly><br><br>

        <label>Country</label>
        <input type="text" value="Argentina" disabled> <br><br>

        <!-- gender -->
        <p>Gender : </p>
        <input type="radio" name="gender" value="male">
        <label>Male</label>
        <input type="radio" name="gender" value="female">
        <label>Female</label><br><br>

        <input type="file">


        <br><br><button type="submit">Submit Now</button>




    </form>

</body>

</html>
