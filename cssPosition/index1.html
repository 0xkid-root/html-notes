<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            border: 2px solid gray;
            padding: 23px;
            margin: 30px;
            /* position: relative; */

        }


        .box {
            width: 100px;
            height: 100px;
            margin: 3px;
            display: inline-block;
            border: 2px solid black;
            background-color: brown;
        }

        #box1 {
            position: static;
            top: 50px;
            left: 40px;
        }

        #box2 {
            position: relative;
            /* top: 20px;
            left: 30px; */
        }

        #box3 {
            position: absolute;
            top: 10px;

        }

        /* #box4 {
            position: relative;
            z-index: 10;
        } */
    </style>
</head>

<body>
    <h1>Position playground </h1>

    <div class="parent">
        <div id="box1" class="box" style="background-color: red;">BOX1</div>
        <div id="box2" class="box" style="background-color: green;">BOX2</div>

        <div id="box3" class="box" style="background-color: blue;">BOX3</div>

        <div id="box4" class="box" style="background-color: yellow; width: 200px;">BOX4</div>


    </div>




</body>

</html>
